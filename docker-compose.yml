# docker-compose.yml — Victron -> InfluxDB collector
#
# Runs ONLY the collector and attaches it to the existing InfluxDB network.
# It does NOT touch your InfluxDB / Grafana / Telegraf containers or their data.
#
#   docker compose up -d --build
#
services:
  victron:
    build: .
    image: fidozbox/victronvenus-influxdb:latest
    container_name: victron-influx
    restart: unless-stopped
    environment:
      INFLUXDB: influxdb            # InfluxDB container name on the shared network
      INFLUXPORT: "8086"
      VENUS: "192.168.10.112"       # Venus GX static IP
      VENUSPORT: "502"
      UNITID: "100"
      # DEBUG: "1"                  # uncomment to enable -d logging
    networks:
      - monitoring

networks:
  # The default network of your existing "docker-monitoring" compose project,
  # where InfluxDB already lives. Managed elsewhere, so declared external here.
  monitoring:
    external: true
    name: docker-monitoring_default
